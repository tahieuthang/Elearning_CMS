name: Deploy to Production

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-dev
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure verified server host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Missing SSH_KNOWN_HOSTS repository secret."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage Composer GitHub authentication on server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          COMPOSER_GITHUB_TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
        run: |
          if [ -z "$COMPOSER_GITHUB_TOKEN" ]; then
            echo "::error::Missing COMPOSER_GITHUB_TOKEN repository secret."
            exit 1
          fi

          auth_file="$(mktemp)"
          trap 'rm -f "$auth_file"' EXIT
          umask 077
          printf '{"github-oauth":{"github.com":"%s"}}' "$COMPOSER_GITHUB_TOKEN" > "$auth_file"

          ssh "${SSH_USER}@${SSH_HOST}" \
            'umask 077; rm -f /tmp/elearning-composer-auth.json; cat > /tmp/elearning-composer-auth.json; chmod 600 /tmp/elearning-composer-auth.json' \
            < "$auth_file"

      - name: Deploy to production server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          BACKUP_DIR: ${{ secrets.BACKUP_DIR }}
          DEPLOY_REF: dev
        run: |
          ssh "${SSH_USER}@${SSH_HOST}" \
            "PROJECT_PATH='${PROJECT_PATH}' BACKUP_DIR='${BACKUP_DIR}' DEPLOY_REF='${DEPLOY_REF}' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          : "${PROJECT_PATH:=/var/www/elearning}"
          : "${BACKUP_DIR:=$HOME/elearning-backups}"
          : "${DEPLOY_REF:=dev}"
          : "${COMPOSER_AUTH_FILE:=/tmp/elearning-composer-auth.json}"

          cleanup_composer_auth() {
            rm -f "$COMPOSER_AUTH_FILE"
          }
          trap cleanup_composer_auth EXIT HUP INT TERM

          if [ ! -s "$COMPOSER_AUTH_FILE" ]; then
            echo "Composer authentication payload is missing on the server."
            exit 1
          fi
          export COMPOSER_AUTH_FILE

          compose() {
            docker compose -f docker-compose.yml "$@"
          }

          echo "Starting deployment of ${DEPLOY_REF}..."
          cd "$PROJECT_PATH"

          echo "Pulling latest code..."
          git fetch --prune origin "$DEPLOY_REF"
          git reset --hard "origin/$DEPLOY_REF"

          echo "Validating production Compose configuration..."
          compose config --quiet

          if compose ps -q mysql | grep -q .; then
            echo "Creating database backup..."
            mkdir -p "$BACKUP_DIR"
            backup_file="$BACKUP_DIR/vfl-academy_$(date +%Y%m%d_%H%M%S).sql"
            compose exec -T mysql sh -ceu 'exec mysqldump -u root -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' > "$backup_file"
          else
            echo "MySQL container is not running; skipping database backup."
          fi

          echo "Building Docker images..."
          compose build
          rm -f "$COMPOSER_AUTH_FILE"

          echo "Backing up existing host uploads before volume migration..."
          if [ -d "$PROJECT_PATH/public/uploads" ]; then
            mkdir -p "$BACKUP_DIR"
            uploads_backup="$BACKUP_DIR/uploads_$(date +%Y%m%d_%H%M%S).tar.gz"
            tar -C "$PROJECT_PATH/public" -czf "$uploads_backup" uploads
          else
            echo "No host uploads directory found; skipping upload backup."
          fi

          echo "Initializing persistent upload and build asset volumes..."
          compose --profile maintenance run --rm uploads-init
          compose --profile maintenance run --rm assets

          echo "Starting containers..."
          compose up -d --remove-orphans

          echo "Waiting for Laravel to become ready..."
          ready=false
          for attempt in $(seq 1 30); do
            if compose exec -T app php artisan about > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Laravel did not become ready within 60 seconds."
            compose logs --tail=200 app nginx queue
            exit 1
          fi

          echo "Running migrations..."
          compose exec -T app php artisan migrate --force

          echo "Optimizing Laravel caches..."
          compose exec -T app php artisan optimize:clear
          compose exec -T app php artisan config:cache
          compose exec -T app php artisan route:cache
          compose exec -T app php artisan view:cache

          echo "Running HTTP health check..."
          healthy=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://localhost/health-check > /dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "Health check failed."
            compose logs --tail=200 app nginx queue
            exit 1
          fi

          echo "Deployment completed successfully."
          REMOTE_SCRIPT

      - name: Notify deployment success
        if: success()
        run: echo "Deployment to production completed successfully."

      - name: Notify deployment failure
        if: failure()
        run: echo "Deployment failed."
