services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: elearning
    container_name: elearning-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    command: php-fpm -y /usr/local/etc/php-fpm.conf -R

  nginx:
    image: nginx:alpine
    container_name: elearning-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: elearning_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: vfl-academy
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: elearning_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elearning-queue
    command: ./start-queue.sh
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      - app
      - mysql
      - redis

volumes:
  mysql_data: