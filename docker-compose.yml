version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: elearning
    container_name: elearning-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    command: php-fpm -y /usr/local/etc/php-fpm.conf -R

  nginx:
    image: nginx:alpine
    container_name: elearning-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker-compose/nginx/ssl/etc:/etc/letsencrypt
      - ./docker-compose/nginx/ssl/certbot:/var/www/certbot
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: elearning_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: vfl-academy
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elearning-queue
    command: php artisan queue:work
    volumes:
      - .:/var/www
    depends_on:
      - app
      - mysql

  certbot:
    image: certbot/certbot
    container_name: elearning-certbot
    volumes:
      - ./docker-compose/nginx/ssl/etc:/etc/letsencrypt
      - ./docker-compose/nginx/ssl/certbot:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot \ --email tahieuthang@gmail.com --agree-tos --no-eff-email \ -d elearning-cms.site -d www.elearning-cms.site


volumes:
  mysql_data:
