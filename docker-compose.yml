services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - source: composer_auth
          target: composer_auth
    image: elearning
    container_name: elearning-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - public_build:/var/www/public/build:ro
      - public_uploads:/var/www/public/uploads
    depends_on:
      - mysql
      - redis
    command: php-fpm -y /usr/local/etc/php-fpm.conf -R

  nginx:
    build:
      context: .
      dockerfile: docker-compose/nginx/Dockerfile
    image: elearning-nginx
    container_name: elearning-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/elearning/ssl/certbot:/var/www/certbot
      - public_build:/var/www/public/build:ro
      - public_uploads:/var/www/public/uploads:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: elearning_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: elearning_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]

  queue:
    image: elearning
    container_name: elearning-queue
    command: ./start-queue.sh
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    depends_on:
      - app
      - mysql
      - redis

  assets:
    image: elearning
    user: "0:0"
    working_dir: /var/www
    profiles:
      - maintenance
    volumes:
      - public_build:/target
    command: >-
      sh -ec 'find /target -mindepth 1 -maxdepth 1 -exec rm -rf {} +;
      cp -a /var/www/public/build/. /target/'

  uploads-init:
    image: alpine:3.20
    user: "0:0"
    profiles:
      - maintenance
    volumes:
      - ./public/uploads:/source:ro
      - public_uploads:/target
    command: >-
      sh -ec 'if [ ! -f /target/.initialized ]; then
      if [ -d /source ]; then cp -a /source/. /target/; fi;
      touch /target/.initialized;
      fi'

volumes:
  mysql_data:
  public_build:
  public_uploads:

secrets:
  composer_auth:
    file: "${COMPOSER_AUTH_FILE:?COMPOSER_AUTH_FILE is required for image builds}"
