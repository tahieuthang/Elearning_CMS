version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: elearning
    container_name: elearning-app
    restart: unless-stopped
    working_dir: /var/www
    # Bind host public folder into the app container so PHP writes are visible to nginx
    volumes:
      - ./public:/var/www/public
      # Mount storage so uploads live in storage (storage/app/public) and are shared with nginx/queue
      - ./storage:/var/www/storage
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    command: php-fpm -y /usr/local/etc/php-fpm.conf -R

  nginx:
    image: nginx:alpine
    container_name: elearning-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker-compose/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/elearning/ssl/certbot:/var/www/certbot
      # Mount the application public folder so nginx can serve static files
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/public/uploads:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: elearning_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: vfl-academy
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  queue:
    image: elearning
    container_name: elearning-queue
    command: ./start-queue.sh
    restart: unless-stopped
    working_dir: /var/www
    # Mount public so queue worker can access uploaded files created by the app container
    volumes:
      - ./public:/var/www/public
      # Mount storage so queue can read files in storage/app/public
      - ./storage:/var/www/storage
    depends_on:
      - app
      - mysql
volumes:
  mysql_data:
  app_code:
