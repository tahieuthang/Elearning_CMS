server {
    listen 80;
    server_name elearning-cms.site www.elearning-cms.site;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    # location /uploads/ {
    #     alias /var/www/public/uploads/;
    #     access_log off;
    #     expires 30d;
    #     add_header Cache-Control "public";
    # }

    error_log /var/log/nginx/api_error_log.log debug;
    access_log /var/log/nginx/access.log;
}

# HTTPS - xử lý request thật
server {
    listen 443 ssl;
    server_name elearning-cms.site www.elearning-cms.site;

    ssl_certificate /etc/letsencrypt/live/elearning-cms.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elearning-cms.site/privkey.pem;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }
}
