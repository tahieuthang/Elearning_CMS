server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        
        # CORS được xử lý bởi Laravel, không set ở đây để tránh conflict
        # Nếu cần, có thể uncomment và sửa theo origin cụ thể
        # add_header 'Access-Control-Allow-Origin' 'https://marth-venerative-ferally.ngrok-free.dev' always;
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        # add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, x-redirect-on-401' always;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}